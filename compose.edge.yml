# Edge deployment: mana-hive + mana-hub + bridge
# 3 residentes, 8 cámaras, ~832M RAM con Leyden AOT
#
# Usage:
#   1. Build JARs: ./build.sh
#   2. Generate AOT caches: docker compose -f compose.edge.yml up aotgen-hive aotgen-hub aotgen-bridge
#   3. Run: ./deploy.sh
#
name: ${COMPOSE_PROJECT_NAME:-mana-edge}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mana_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for edge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mana_hub"]
      interval: 5s
      retries: 10

  nats:
    image: nats:latest
    restart: unless-stopped
    command: ["-js", "--store_dir=/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── AOT Training (run once, or after code changes) ──
  aotgen-hive:
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.aotgen
      args:
        JAR_FILE: aot-jvm/engines-night-watch-runtime.jar
    user: "0:0"
    environment:
      AOT_DIR: /cache
      AOT_CACHE: /cache/app.aot
    volumes:
      - ./cache:/cache
    restart: "no"

  aotgen-hub:
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.aotgen
      args:
        JAR_FILE: aot-jvm/bootstrap-1.0.0-SNAPSHOT.jar
    user: "0:0"
    command: ["/bin/sh","-c","mkdir -p /cache-hub && java -Xmx512m -XX:MaxMetaspaceSize=256m -XX:AOTCacheOutput=/cache-hub/app.aot -Dspring.context.exit=onRefresh -jar app.jar"]
    environment:
      AOT_DIR: /cache-hub
      AOT_CACHE: /cache-hub/app.aot
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mana_hub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for edge}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./cache-hub:/cache-hub
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  aotgen-bridge:
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.aotgen
      args:
        JAR_FILE: aot-jvm/event-bridge-1.0.0-SNAPSHOT.jar
    user: "0:0"
    environment:
      AOT_DIR: /cache-bridge
      AOT_CACHE: /cache-bridge/app.aot
      NATS_URL: nats://nats:4222
    volumes:
      - ./cache-bridge:/cache-bridge
    depends_on:
      nats:
        condition: service_started
    restart: "no"

  # ── Runtimes (Leyden AOT + Xmx acotado) ──
  mana-hive:
    image: ${MANA_IMAGE_PREFIX:-mana}/mana-hive:${MANA_VERSION:-local}
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.deploy
      args:
        JAR_FILE: aot-jvm/engines-night-watch-runtime.jar
    command: ["java", "-Xmx256m", "-XX:MaxMetaspaceSize=96m", "-XX:AOTCache=/cache/app.aot", "-jar", "app.jar"]
    environment:
      AOT_DIR: /cache
      AOT_CACHE: /cache/app.aot
      NATS_URL: nats://nats:4222
    volumes:
      - ./cache:/cache
      - ./config/mana-hive/application.yml:/application/application.yml
      - ./config/mana-hive/profiles:/application/profiles:ro
      - ./shared/logs/hive:/application/logs
    depends_on:
      nats:
        condition: service_started
    ports:
      - "18081:8081"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M

  mana-hub:
    image: ${MANA_IMAGE_PREFIX:-mana}/mana-hub:${MANA_VERSION:-local}
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.deploy
      args:
        JAR_FILE: aot-jvm/bootstrap-1.0.0-SNAPSHOT.jar
    command: ["java", "-Xmx512m", "-XX:MaxMetaspaceSize=192m", "-XX:AOTCache=/cache-hub/app.aot", "-jar", "app.jar"]
    environment:
      AOT_DIR: /cache-hub
      AOT_CACHE: /cache-hub/app.aot
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mana_hub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for edge}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./cache-hub:/cache-hub
      - ./config/mana-hub/application.yml:/application/application.yml
      - ./shared/logs/hub:/application/logs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MANA_HUB_PORT:-8080}:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700M

  bridge:
    image: ${MANA_IMAGE_PREFIX:-mana}/mana-bridge:${MANA_VERSION:-local}
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.deploy
      args:
        JAR_FILE: aot-jvm/event-bridge-1.0.0-SNAPSHOT.jar
    command: ["java", "-Xmx256m", "-XX:MaxMetaspaceSize=96m", "-XX:AOTCache=/cache-bridge/app.aot", "-jar", "app.jar"]
    environment:
      AOT_DIR: /cache-bridge
      AOT_CACHE: /cache-bridge/app.aot
      NATS_URL: nats://nats:4222
      BRIDGE_TARGET_URL: http://mana-hub:8080
    volumes:
      - ./cache-bridge:/cache-bridge
      - ./config/bridge/application.yml:/application/application.yml
      - ./shared/logs/bridge:/application/logs
    depends_on:
      nats:
        condition: service_started
      mana-hub:
        condition: service_started
    ports:
      - "${MANA_BRIDGE_PORT:-8090}:8090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 350M

  mana-ui:
    image: ${MANA_IMAGE_PREFIX:-mana}/mana-ui:${MANA_VERSION:-local}
    build:
      context: ..
      dockerfile: mana-dist/mana-ui/Dockerfile
    ports:
      - "${MANA_UI_PORT:-3000}:80"
    depends_on:
      mana-hub:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  mana-cox:
    image: ${MANA_IMAGE_PREFIX:-mana}/mana-cox:${MANA_VERSION:-local}
    build:
      context: .
      dockerfile: aot-jvm/Dockerfile.deploy
      args:
        JAR_FILE: aot-jvm/mana-cox.jar
    command: ["java", "-Xmx256m", "-XX:MaxMetaspaceSize=96m", "-jar", "app.jar"]
    environment:
      SERVER_PORT: 8091
      SPRING_PROFILES_ACTIVE: mongodb
      MONGODB_URI: mongodb://mongo:27017/mana_cox
      COX_NATS_URL: nats://nats:4222
      COX_HUB_URL: http://mana-hub:8080
      COX_HIVE_URL: http://mana-hive:8081
      COX_PROFILE_PATH: /application/profiles/jose-v-min.json
      COX_PROFILE_PATH_02: /application/profiles/jose-v14.json
    volumes:
      - ./config/mana-hive/profiles:/application/profiles:ro
      - ./shared/logs/cox:/application/logs
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_started
      mana-hive:
        condition: service_started
      mana-hub:
        condition: service_started
    ports:
      - "${MANA_COX_PORT:-8091}:8091"
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
  mongodata:
