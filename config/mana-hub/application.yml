server:
  port: 8080

spring:
  application:
    name: mana-hub
  datasource:
    url: jdbc:postgresql://postgres:5432/mana_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-null-for-primitives: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

nats:
  enabled: false
  url: nats://nats:4222

bridge:
  target:
    url: http://bridge:8090

logging:
  level:
    com.hub: INFO
    org.flywaydb: INFO
    com.manahive: INFO
